[workspace]
resolver = "2"
members = ["src-tauri", "crates/orchestrator-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ab1t"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
orchestrator-core = { path = "crates/orchestrator-core" }
